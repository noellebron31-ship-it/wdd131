<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This is a form for WDD 131 class">
    <meta name="author" content="Adonis lebron">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js"></script>

</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm">
            
            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    </select>
            </div>

            <div class="form-group">
                <fieldset>
                    <legend>Overall Rating <span class="required">*</span></legend>
                    <div class="rating-group">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">☆</label>
                        
                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">☆</label>
                        
                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">☆</label>
                        
                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">☆</label>
                        
                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 star">☆</label>
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="installationDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>

            <div class="form-group">
                <fieldset>
                    <legend>Useful Features (Check all that apply)</legend>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="featureDurability" name="features" value="durability">
                        Durability
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="featureDesign" name="features" value="design">
                        Elegant Design
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="featurePerformance" name="features" value="performance">
                        High Performance
                    </label>
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="featureEase" name="features" value="easeOfUse">
                        Ease of Use
                    </label>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName" placeholder="e.g., Marty McFly">
            </div>

            <input type="submit" id="submitBtn" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Adonis lebron. All rights reserved.</p>
    </footer>
</body>
</html>
